<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Question | Smart Education</title><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="TeacherQuestion.css"></head><body><div class="app"><header class="topbar"><a class="brand-cap" href="Open.html" aria-label="Open"><img src="education-cap.svg" alt=""></a><div class="top-actions"><button class="icon-btn theme-moon" onclick="toggleTheme()" title="Dark mode">☾</button><button class="icon-btn theme-sun" onclick="toggleTheme()" title="White mode">☼</button><a class="profile-button" href="StudentProfile.html" title="Profile"><span class="profile-avatar" id="topAvatar">S</span></a></div></header><main class="page page-teacherquestion"><section class="hero"><div class="hero-copy"><h1>Let's start a smart class<br>with <strong>Akash Karmakar</strong></h1><p id="paperMeta"></p></div><img class="hero-img" src="logo.svg"></section><div class="builder" style="margin-top:8px"><aside class="q-list" id="qList"></aside><section class="builder-main"><div class="card" style="margin-top:0"><div class="question-head"><b id="counter">Question 1</b><span class="badge">All Question Types</span></div><div class="type-pills"><span>MCQ</span><span>True / False</span><span>Fill in the blank</span><span>Short answer</span><span>Long answer</span></div><div class="field"><label>Question Type</label><select id="type" onchange="typeChanged()"><option value="mcq">MCQ</option><option value="truefalse">True / False</option><option value="fillblank">Fill in the blank</option><option value="short">Short Answer</option><option value="long">Long Answer</option></select></div><div class="field"><label>Question</label><textarea id="question" placeholder="Write the question..."></textarea></div><div id="typeEditor" class="type-editor"></div><div class="two"><div class="field"><label>Marks</label><input id="marks" type="number" min="1" value="1"></div><div class="field"><label>Time (minutes)</label><input id="time" type="number" min="1" value="5"></div></div><div class="actions"><button class="btn secondary" onclick="backQuestion()">← Back question</button><button class="btn secondary" onclick="nextQuestion()">Next question →</button><button class="btn full" onclick="saveQuestion()">Save question</button></div></div></section></div></main></div><script src="app.js"></script><script src="TeacherQuestion.js"></script></body></html>
